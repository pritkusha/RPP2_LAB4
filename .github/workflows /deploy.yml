name: Deploy Release

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Clone main and gh-pages
        run: |
          # Клонируем main ветку
          git clone https://github.com/${{ github.repository }}.git main-repo
          
          # Клонируем gh-pages ветку
          git clone -b gh-pages https://github.com/${{ github.repository }}.git gh-pages-repo

      - name: Prepare versioned folder
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          
          # Создаем версионную папку в gh-pages
          mkdir -p gh-pages-repo/v$VERSION
          
          # Копируем файлы из main в версионную папку
          cp -r main-repo/en main-repo/ru main-repo/index.html gh-pages-repo/v$VERSION/

      - name: Deploy to gh-pages
        run: |
          cd gh-pages-repo
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add .
          git commit -m "Deploy version ${{ github.ref_name }}"
          git push
