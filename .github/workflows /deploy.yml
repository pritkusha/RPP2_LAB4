name: Deploy to GitHub Pages

on:
  release:
    types: [published]
    
jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      # 1. Получаем код релиза (из ветки main или default branch)
      - name: Checkout main code
        uses: actions/checkout@v3
        with:
          ref: main
          
      # 2. Получаем текущий gh-pages
      - name: Get gh-pages branch
        uses: actions/checkout@v3
        with:
          ref: gh-pages
          path: gh-pages-content
          
      # 3. Подготавливаем структуру версий
      - name: Prepare versioned structure
        run: |
          # Создаем папку для новой версии
          mkdir -p gh-pages-content/v${{ github.event.release.tag_name }}
          
          # Копируем все файлы сайта в папку версии
          # Сохраняем структуру папок ru/ и en/
          cp -r ./*.html ./ru ./en ./assets gh-pages-content/v${{ github.event.release.tag_name }}/
          
          # Обновляем основную (последнюю) версию в корне
          cp -r ./*.html ./ru ./en ./assets gh-pages-content/
          
          # Добавляем текущую версию в файл версий (опционально)
          echo "${{ github.event.release.tag_name }}" >> gh-pages-content/versions.txt
          
      # 4. Публикуем на GitHub Pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./gh-pages-content
          publish_branch: gh-pages
          force_orphan: false
