name: Deploy Release

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout and setup
        run: |
          # Клонируем репозиторий
          git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git repo
          cd repo
          
          # Переключаемся на gh-pages
          git checkout gh-pages
          
          # Создаем версионную папку
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          mkdir -p v$VERSION
          
          # Скачиваем файлы напрямую из main ветки
          git checkout main -- en ru index.html
          cp -r en ru index.html v$VERSION/
          rm -rf en ru index.html
          
          # Коммитим и пушим
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add .
          git commit -m "Deploy version ${{ github.ref_name }}"
          git push
