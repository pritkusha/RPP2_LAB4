name: Deploy Release

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Create version folder
        run: |
          VERSION="${{ github.ref_name }}"
          mkdir -p v$VERSION
          cp -r ru en index.html v$VERSION/

      - name: Publish
        run: |
          git add .
          git commit -m "Deploy ${{ github.ref_name }}"
          git push
