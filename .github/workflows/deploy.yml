name: Deploy Release

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create version folder and copy files
        run: |
          mkdir -p ${{ github.ref_name }}
          cp -r ru en index.html ${{ github.ref_name }}/

      - name: Commit and push changes
        run: |
          git add .
          git commit -m "Deploy ${{ github.ref_name }}" || exit 0
          git push
