name: Deploy Release

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gh-pages with token
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create version folder
        run: |
          mkdir -p ${{ github.ref_name }}
          cp -r ru en index.html ${{ github.ref_name }}/

      - name: Push changes
        run: |
          git add .
          git commit -m "Add ${{ github.ref_name }}" || echo "No changes to commit"
          git push
