name: Deploy Release

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Шаг 1: Получение кода из ветки gh-pages
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          
      # Шаг 2: Создание версионной папки и копирование файлов
      - name: Создание версионной папки
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"  # Убираем 'v' если он есть в начале
          mkdir -p v$VERSION
          cp -r ru en index.html v$VERSION/
          
      # Шаг 3: Публикация изменений
      - name: Публикация
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "Deploy version ${{ github.ref_name }}"
          git push
