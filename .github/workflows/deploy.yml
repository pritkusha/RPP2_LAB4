name: Deploy Release

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout and deploy
        run: |
          # Клонируем репозиторий
          git clone https://github.com/${{ github.repository }}.git repo
          cd repo
          
          # Переключаемся на ветку gh-pages
          git fetch origin gh-pages
          git checkout gh-pages
          
          # Создаем версионную папку
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          mkdir -p v$VERSION
          cp -r ../ru ../en ../index.html v$VERSION/ 2>/dev/null || true
          
          # Настраиваем Git и пушим изменения
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add .
          git commit -m "Deploy version ${{ github.ref_name }}" || exit 0
          git push https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git gh-pages
