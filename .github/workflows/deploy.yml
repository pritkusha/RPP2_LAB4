name: Deploy Release

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Create version folder
        run: |
          mkdir -p ${{ github.ref_name }}
          cp -r ru en index.html ${{ github.ref_name }}/

      - name: Publish
        run: |
          git add .
          git commit -m "Deploy ${{ github.ref_name }}"
          git push
