name: Deploy Release

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Клонирование ветки gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Создание версионной папки
        run: |
          mkdir -p v${{ github.ref_name }}
          cp -r ru en index.html v${{ github.ref_name }}/

      - name: Публикация изменений
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add .
          git commit -m "Add version ${{ github.ref_name }}"
          git push
